name: Perbarui data dan deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 1 * *'   # tanggal 1 tiap bulan, 09:00 WIB
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Perbarui data
        if: github.event_name != 'push'
        run: node scripts/update.mjs
      - name: Simpan data baru
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "chore(data): perbarui data $(date -u +%Y-%m)"
          git push
      - name: Susun situs
        run: |
          mkdir _site
          cp -r index.html data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
