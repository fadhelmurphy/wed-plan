<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cari gedung pernikahan terdekat, vendor, dan hitung anggaran pernikahan.">
<meta name="theme-color" content="#DDD8F1">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Rencana Nikah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: kolom ponsel dengan tab bar melayang; di layar lebar muncul rel ikon di kiri dan kartu kaca tersusun dua kolom. */
:root{
  --bg:#DDD8F1; --glow1:#C7BEF0; --glow2:#F7D9CF; --glow3:#E9E2FA;
  --glass:rgba(255,255,255,.66); --solid:#F7F5FD; --edge:rgba(255,255,255,.95);
  --shadow:0 12px 32px rgba(105,92,190,.16);
  --ink:#24233F; --muted:#76749A; --primary:#6B6DD9; --soft:#E4E1F8; --on-primary:#FFFFFF;
  --violet-a:#8479DD; --violet-b:#6A5FD0; --navy:#27284B; --on-navy:#FFFFFF;
  --coral:#E8847F; --peach:#F5C7B4; --good:#2F7D5B; --warn:#A8651F; --line:rgba(110,100,190,.16);
  --c1:#6B6DD9; --c2:#A79CEA; --c3:#F5C7B4; --c4:#E8847F; --c5:#CFC9EE;
  --font-d:'Poppins','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15132A; --glow1:#2D2766; --glow2:#4A2A45; --glow3:#1F1B45;
  --glass:rgba(44,40,88,.62); --solid:#241F4A; --edge:rgba(255,255,255,.1);
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --ink:#EFECFF; --muted:#ABA7D2; --primary:#9C9EF6; --soft:#3A3578; --on-primary:#17152E;
  --violet-a:#6D62C8; --violet-b:#4F45A8; --navy:#9C9EF6; --on-navy:#17152E;
  --coral:#F0948E; --peach:#F5C7B4; --good:#7CC59A; --warn:#E3A964; --line:rgba(180,170,255,.16);
  --c1:#9C9EF6; --c2:#6D62C8; --c3:#F5C7B4; --c4:#F0948E; --c5:#5A5496; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15132A; --glow1:#2D2766; --glow2:#4A2A45; --glow3:#1F1B45;
  --glass:rgba(44,40,88,.62); --solid:#241F4A; --edge:rgba(255,255,255,.1);
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --ink:#EFECFF; --muted:#ABA7D2; --primary:#9C9EF6; --soft:#3A3578; --on-primary:#17152E;
  --violet-a:#6D62C8; --violet-b:#4F45A8; --navy:#9C9EF6; --on-navy:#17152E;
  --coral:#F0948E; --peach:#F5C7B4; --good:#7CC59A; --warn:#E3A964; --line:rgba(180,170,255,.16);
  --c1:#9C9EF6; --c2:#6D62C8; --c3:#F5C7B4; --c4:#F0948E; --c5:#5A5496; color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(60% 45% at 0% 0%,var(--glow1),transparent 72%),radial-gradient(55% 40% at 100% 28%,var(--glow2),transparent 72%),radial-gradient(60% 40% at 20% 100%,var(--glow3),transparent 72%);background-attachment:fixed;color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:18px 120px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:600;text-wrap:balance}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px} .acc{color:var(--primary)}
a{color:var(--primary)}

.dots{position:fixed;inset:0;pointer-events:none;z-index:0}
.dots i{position:absolute;border-radius:50%;background:#fff;opacity:.85}
.dots i:nth-child(1){left:6%;top:22%;width:14px;height:14px}
.dots i:nth-child(2){right:9%;top:14%;width:10px;height:10px}
.dots i:nth-child(3){left:3%;top:64%;width:8px;height:8px}
.dots i:nth-child(4){right:5%;top:58%;width:16px;height:16px}
.dots i:nth-child(5){left:46%;top:92%;width:12px;height:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dots i{opacity:.18}}
:root[data-theme="dark"] .dots i{opacity:.18}

.shell{position:relative;z-index:1;max-width:480px;margin-inline:auto}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:none}
.g{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--edge);border-radius:28px;box-shadow:var(--shadow)}
.pad{padding:18px}

.topbar{display:flex;gap:12px;align-items:center}
.spacer{flex:1}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:48px;padding-inline:16px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);text-align:left;font-weight:500}
.pill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow);color:var(--ink)}
.icon-btn.on{background:var(--primary);color:var(--on-primary)}
.ptitle h1{font-size:26px;line-height:1.2}
.ptitle p{margin-top:6px;color:var(--muted);font-size:13px}

.welcome,.total{position:relative;overflow:hidden;border-radius:36px;background:linear-gradient(155deg,var(--violet-a),var(--violet-b));color:#fff;box-shadow:0 18px 40px rgba(90,76,200,.28)}
.welcome{padding:28px 24px 26px;min-height:310px;display:flex}
.wtxt{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:62%}
.welcome h1{font-size:30px;line-height:1.14;font-weight:700}
.welcome p{font-size:13px;opacity:.95}
.wtxt .btn{margin-top:auto}
.art{position:absolute;right:-10px;bottom:-8px;width:56%;max-width:300px;height:auto;z-index:1}
.total{padding:22px 22px 24px;min-height:190px}
.total .art{width:46%;bottom:-6px;right:-6px;max-width:200px}
.total .btn{position:relative;z-index:2;margin-top:16px}
.total .btn svg{width:18px;height:18px}
.total .lbl{font-size:13px;opacity:.92}
.total .amt{font-family:var(--font-d);font-weight:700;font-size:38px;line-height:1.15;margin-top:6px}
.total .rng{font-size:12.5px;opacity:.95;margin-top:6px;max-width:68%}
.total>div{position:relative;z-index:2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding-inline:22px;border-radius:23px;background:var(--primary);color:var(--on-primary);font-weight:600;white-space:nowrap}
.btn.navy{background:var(--navy);color:var(--on-navy);box-shadow:0 8px 18px rgba(39,40,75,.3)}
.btn.ghost{background:var(--soft);color:var(--primary)}
.btn.sm{height:34px;padding-inline:14px;font-size:12px;border-radius:17px}
.btn.wide{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sechead h2{font-size:19px}
.seg{display:flex;background:var(--soft);border-radius:22px;padding:4px;gap:2px}
.seg button{flex:1;height:36px;padding-inline:16px;border-radius:18px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.scrollx{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx button{flex:none;height:38px;padding-inline:16px;border-radius:19px;background:var(--glass);border:1px solid var(--edge);font-size:13px;font-weight:500;color:var(--muted)}
.scrollx button.on{background:var(--primary);color:var(--on-primary);border-color:transparent}

.cols{display:grid;gap:12px;grid-template-columns:1fr}
.vrow{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;text-align:left;width:100%;min-width:0}
.av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;display:block}
.av svg{width:100%;height:100%;display:block}
.av.ini{display:grid;place-items:center;font-family:var(--font-d);font-weight:600;color:#fff;font-size:16px}
.vb{flex:1;min-width:0;display:flex;flex-direction:column}
.vb b{font-family:var(--font-d);font-weight:500;font-size:14.5px;line-height:1.3}
.vp{text-align:right;display:flex;flex-direction:column;flex:none}
.vp b{font-family:var(--font-d);font-weight:600;font-size:14.5px;white-space:nowrap}
.vp small{font-size:11px;color:var(--muted)}

.media{position:relative;border-radius:30px;height:190px;background:linear-gradient(160deg,var(--soft),var(--glass));border:1px solid var(--edge);overflow:hidden;display:grid;place-items:center}
.media svg.big{width:62%;max-width:300px;height:auto}
.mbadge{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;background:var(--solid);color:var(--primary);display:grid;place-items:center;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile b{font-family:var(--font-d);font-weight:600;font-size:22px;line-height:1.1}
.tile small{color:var(--muted);font-size:12px}
.sq{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center}
.sq.fill{background:var(--primary);color:var(--on-primary)}
.sq.fill b{font-size:14px;font-weight:600}
.inforow{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px}
.inforow .av{width:40px;height:40px}
.inforow span.t{flex:1;min-width:0;font-weight:500}
.pkg{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pkg.sel{outline:2px solid var(--primary);outline-offset:-2px}
.pkg .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pkg h3{font-size:15px;font-weight:600}
.price{font-family:var(--font-d);font-weight:600;color:var(--primary);font-size:17px;white-space:nowrap}
.note{background:var(--soft);border-radius:20px;padding:14px 16px;font-size:13px}
.chart{width:100%;height:auto;display:block}
.empty{text-align:center;padding:26px 8px;color:var(--muted)}

.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:500;border:1px solid var(--primary);color:var(--primary);white-space:nowrap}
.tag.src{border-color:var(--good);color:var(--good)}
.tag.est{border-color:var(--warn);color:var(--warn)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.bgrid{display:grid;gap:18px;grid-template-columns:1fr}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--coral),var(--primary))}
.pct{font-family:var(--font-d);font-weight:600;font-size:30px;line-height:1.2}
.tgt{display:flex;align-items:center;gap:8px}
.tgt .inp{width:110px;height:38px;text-align:right}
.inp{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--solid);padding-inline:14px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spills{display:flex;flex-direction:column;gap:10px}
.spill{display:flex;align-items:center;gap:12px;height:58px;padding-inline:18px;border-radius:29px;color:var(--ink)}
.spill svg{color:var(--coral)}
.spill>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spill b,.spill .pin{font-weight:600;text-align:right}
.pin{width:92px;height:36px;border:0;background:transparent;font-size:15px;border-radius:10px}
.pin:focus-visible{background:var(--soft)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.bar span{display:block}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12px;margin-top:12px}
.legend span{display:flex;gap:8px;align-items:center;min-width:0}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding-block:13px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it.off{opacity:.45}
.nm{min-width:0;display:flex;flex-direction:column;gap:4px}
.am{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.am button{display:block;margin-left:auto;font-size:11px;color:var(--primary);font-weight:500}
.cb{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--primary);display:grid;place-items:center;color:var(--on-primary);margin-top:1px}
.cb.on{background:var(--primary)}
.cb svg{width:14px;height:14px;stroke-width:2.4}
.edit{display:flex;gap:8px;align-items:center;margin-top:6px}
.edit .inp{height:36px;width:110px}

.cal{padding:20px 18px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calh h2{font-size:22px;font-weight:500}
.calh .btns{gap:6px;flex-wrap:nowrap}
.calh .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.calg .wd{font-size:11.5px;color:var(--muted);padding-bottom:8px}
.calg button,.calg span.e{height:42px;display:grid;place-items:center;position:relative;border-radius:50%;font-variant-numeric:tabular-nums;font-size:14px}
.calg button.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--coral)}
.calg button.sel{background:var(--soft);color:var(--primary);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.week{display:flex;justify-content:space-between;gap:4px;padding:12px 14px}
.week button{flex:1;height:48px;border-radius:24px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.week button.sel{background:var(--soft);color:var(--ink);font-weight:600}
.cnt{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1.1}

.tabbar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.tabbar .in{pointer-events:auto;max-width:448px;margin-inline:auto;height:68px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge);box-shadow:var(--shadow);display:flex;justify-content:space-around;align-items:center;padding-inline:8px}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:500;border-radius:26px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--primary)}

.scrim{position:fixed;inset:0;background:rgba(30,25,70,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:480px;max-height:86%;overflow-y:auto;background:var(--solid);border-radius:32px 32px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:19px}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.x.on{background:var(--primary);color:var(--on-primary)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.opt:first-child{border-top:0}
.opt.on b{color:var(--primary)}
.src-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:12px}

@media print{
  .tabbar,.rail,.topbar,.dots,.scrim,.total .btn,.art{display:none!important}
  body{background:#fff!important;padding:0}
  .g,.total{box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
@media (min-width:640px){
  .cols{grid-template-columns:1fr 1fr}
  .welcome h1{font-size:36px}
}
@media (min-width:900px){
  body{padding-block:28px 48px}
  .shell{max-width:1080px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:28px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:10px;position:sticky;top:28px;padding:12px 10px;border-radius:38px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge);box-shadow:var(--shadow)}
  .rail button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .rail button svg{width:24px;height:24px}
  .rail button.on{background:var(--solid);color:var(--primary);box-shadow:var(--shadow)}
  .tabbar{display:none}
  .bgrid{grid-template-columns:1fr 1fr;align-items:start}
  .welcome{min-height:300px}
  .scrim{align-items:center}
  .panel{border-radius:32px;max-width:440px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gArch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFEAFF"/><stop offset=".5" stop-color="#BDB1F5"/><stop offset="1" stop-color="#7B6BDC"/></linearGradient>
    <linearGradient id="gRing1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3D3"/><stop offset="1" stop-color="#F08F86"/></linearGradient>
    <linearGradient id="gRing2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F0FF"/><stop offset="1" stop-color="#9E92EE"/></linearGradient>
    <radialGradient id="gSph" cx=".32" cy=".28" r=".85"><stop offset="0" stop-color="#F2EEFF"/><stop offset=".5" stop-color="#9A8DEA"/><stop offset="1" stop-color="#4B3FAE"/></radialGradient>
    <radialGradient id="gSphP" cx=".32" cy=".28" r=".85"><stop offset="0" stop-color="#FFF1E8"/><stop offset=".55" stop-color="#F4B8A4"/><stop offset="1" stop-color="#D9776F"/></radialGradient>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB8AE"/><stop offset="1" stop-color="#E4706F"/></linearGradient>
    <linearGradient id="gBarA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E7E1FF"/><stop offset="1" stop-color="#B7AAF2"/></linearGradient>
    <linearGradient id="gBarB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD9C6"/><stop offset="1" stop-color="#F29C8C"/></linearGradient>
    <linearGradient id="gBarC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFC6FF"/><stop offset="1" stop-color="#8576E6"/></linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8847F"/><stop offset="1" stop-color="#6B6DD9"/></linearGradient>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8F84E8" stop-opacity=".35"/><stop offset="1" stop-color="#8F84E8" stop-opacity="0"/></linearGradient>

  b:{target:500000000,pax:500,tier:"standar",qty:40,on:{},over:{},gold:2653000,ringG:4,ringK:18,ringExtra:0,mahrG:10,alat:true,nikah:"kua",venue:null,cateringIncl:false},
  favs:[],date:"",vcat:"wo"};
var S = load();
var UI = {sheet:null,detail:null,editing:null,scroll:0,q:""};

function load(){
  var s = JSON.parse(JSON.stringify(DEF));
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){var o = JSON.parse(raw);
      for(var k in o){ if(k==="f"||k==="b"){ for(var j in o[k]) s[k][j]=o[k][j]; } else s[k]=o[k]; }
    }
  }catch(e){}
  if(!area(s.area)) s.area = DEF.area;
  return s;
}
function save(){ try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} }

/* ============ HELPERS ============ */
function $(s){return document.querySelector(s);}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function area(id){for(var i=0;i<AREAS.length;i++) if(AREAS[i].id===id) return AREAS[i]; return null;}
function venue(id){for(var i=0;i<VENUES.length;i++) if(VENUES[i].id===id) return VENUES[i]; return null;}
function infl(y){return Math.pow(1.045, YEAR-y);}
function rpFull(n){return "Rp"+Math.round(n).toLocaleString("id-ID");}
function jt(n){
  var m = n/1e6;
  if(m>=1000) return "Rp"+(m/1000).toLocaleString("id-ID",{maximumFractionDigits:2})+" M";
  if(m>=1) return "Rp"+m.toLocaleString("id-ID",{maximumFractionDigits:m<10?1:0})+" jt";
  return rpFull(n);
}
function km(a,b,c,d){
  var R=6371, rad=Math.PI/180, dLa=(c-a)*rad, dLo=(d-b)*rad;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function dist(v){var A=area(S.area); return km(A.lat,A.lng,v.lat,v.lng);}
function fmtKm(d){return d<10?d.toFixed(1).replace(".",",")+" km":Math.round(d).toLocaleString("id-ID")+" km";}
function pkgEst(v,p,pax){
  var base = p.unit==="pax" ? p.p*Math.max(pax,p.min||0) : p.p;
  return base*infl(v.year);
}
function lowest(v,pax){
  if(!v.pkgs.length) return null;
  var m=Infinity; v.pkgs.forEach(function(p){var e=pkgEst(v,p,pax); if(e<m) m=e;});
  return m;
}
/* ============ BUDGET ENGINE ============ */
function calc(){
  var b=S.b, A=area(S.area), f=A.lvl, tier=b.tier, rows=[], vc=null;
  if(b.venue){
    var v=venue(b.venue.id), p=v&&v.pkgs[b.venue.pi];
    if(v&&p) vc={v:v,p:p,est:pkgEst(v,p,b.pax)};
  }
  var cIncl = !!vc && (vc.p.unit==="pax" || b.cateringIncl);
  var sub=[0,0,0,0,0];
  ITEMS.forEach(function(it){
    var lo=0, hi=0, note=it.hint, auto=false;
    if(it.id==="gedung" && vc){ lo=vc.est*0.92; hi=vc.est*1.12; note=vc.v.name+" · "+vc.p.n; auto=true; }
    else if(it.id==="katering" && cIncl){ lo=0; hi=0; note="Sudah termasuk paket gedung"; auto=true; }
    else if(it.unit==="flat"||it.unit==="pax"||it.unit==="qty"){
      var m = it.unit==="pax"?b.pax : it.unit==="qty"?b.qty : 1;
      lo=it.r[tier][0]*f*m; hi=it.r[tier][1]*f*m;
    } else if(it.id==="cincin"){
      var pg=b.gold*(b.ringK/24), v1=b.ringG*pg*1.12+Number(b.ringExtra||0);
      lo=hi=v1; note=b.ringG+" g, emas "+b.ringK+"K + ongkos 12%";
    } else if(it.id==="mahar"){
      var mg=b.mahrG*b.gold;
      lo=mg+(b.alat?1.5*M:0); hi=mg+(b.alat?3*M:0); note=b.mahrG+" g emas 24K"+(b.alat?" + alat salat":"");
    } else if(it.id==="nikah"){
      lo=hi=(b.nikah==="kua"?0:600000); note=b.nikah==="kua"?"Di KUA, jam kerja":"Di luar KUA / luar jam kerja";
    }
    var on = b.on[it.id]!==false, ov = b.over[it.id];
    if(ov!=null && ov!==""){ lo=hi=Number(ov); }
    rows.push({it:it,lo:lo,hi:hi,on:on,note:note,auto:auto,ov:(ov!=null&&ov!=="")});
    if(on){ sub[it.g]+=(lo+hi)/2; }
  });
  var tl=0, th=0;
  rows.forEach(function(r){ if(r.on){tl+=r.lo; th+=r.hi;} });
  var cad = S.b.on.cadangan!==false;
  var cl=cad?tl*0.1:0, ch=cad?th*0.1:0;
  return {rows:rows,vc:vc,cIncl:cIncl,low:tl+cl,high:th+ch,mid:(tl+th)/2+(cl+ch)/2,cad:{lo:cl,hi:ch,on:cad},sub:sub,sum:(tl+th)/2};
}

function topbar(o){

   +'<button class="pill" data-act="area" aria-label="Ubah daerah">'+ic("pin")+'<span>'+esc(area(S.area).name)+'</span>'+ic("chev")+'</button>'

function ptitle(t,s){return '<div class="ptitle"><h1>'+t+'</h1>'+(s?'<p>'+s+'</p>':'')+'</div>';}
function filtered(){
  var f=S.f, pax=S.b.pax;
  var list=VENUES.map(function(v){return {v:v,d:dist(v),lo:lowest(v,pax)};});
  list=list.filter(function(x){
    if(f.guests && x.v.cap!=null && x.v.cap<f.guests) return false;
    if(f.max && x.lo!=null && x.lo>f.max*M) return false;
    if(f.type==="sewa" && x.v.kind!=="Sewa gedung") return false;
    if(f.type==="paket" && x.v.kind==="Sewa gedung") return false;
    return true;
  });
  list.sort(function(a,b){
    if(f.sort==="murah"){ var av=a.lo==null?Infinity:a.lo, bv=b.lo==null?Infinity:b.lo; return av-bv || a.d-b.d; }
    return a.d-b.d;
  });
  return list;
}
function priceShort(x){
  var v=x.v;
  if(x.lo==null) return '<span class="vp"><b class="muted" style="font-size:12.5px;font-weight:500">Tanya harga</b></span>';
  var pk=v.pkgs.some(function(p){return p.unit==="pax";});
  if(pk){
    var p0=v.pkgs[0], per=p0.p*infl(v.year);
    return '<span class="vp"><b class="num">Rp'+Math.round(per/1000)+' rb</b><small>mulai / tamu</small></span>';
  }
  return '<span class="vp"><b class="num">'+jt(x.lo)+'</b><small>mulai dari</small></span>';
}

function distChart(cur){
  var pax=S.b.pax, vals=[];
  VENUES.forEach(function(v){var l=lowest(v,pax); if(l!=null) vals.push(l);});
  if(vals.length<4||cur==null) return "";
  var lg=vals.map(function(v){return Math.log10(v);});
  var mn=Math.min.apply(null,lg)-0.15, mx=Math.max.apply(null,lg)+0.15, N=64, bw=0.14, pts=[], peak=0;
  for(var i=0;i<=N;i++){
    var x=mn+(mx-mn)*i/N, s=0;
    lg.forEach(function(l){var z=(x-l)/bw; s+=Math.exp(-0.5*z*z);});
    pts.push(s); if(s>peak) peak=s;
  }
  var W=360,H=140,top=34,base=H-6;
  var xy=pts.map(function(s,i){return (W*i/N).toFixed(1)+","+(base-(s/peak)*(base-top)).toFixed(1);});
  var line="M"+xy.join(" L"), area_=line+" L"+W+","+base+" L0,"+base+" Z";
  var cx=W*(Math.log10(cur)-mn)/(mx-mn);
  var sorted=vals.slice().sort(function(a,b){return a-b;}), med=sorted[Math.floor(sorted.length/2)];
  var cw=84, chipX=Math.min(Math.max(cx-cw/2,0),W-cw), ff='font-family="Plus Jakarta Sans,sans-serif"';
  return '<svg class="chart" viewBox="0 0 '+W+' '+(H+22)+'" role="img" aria-label="Sebaran harga gedung di data dan posisi gedung ini">'
   +[top,(top+base)/2,base].map(function(y){return '<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';}).join("")
   +'<path d="'+area_+'" fill="url(#gArea)"/>'
   +'<path d="'+line+'" fill="none" stroke="url(#gLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<line x1="'+cx.toFixed(1)+'" y1="'+(top-4)+'" x2="'+cx.toFixed(1)+'" y2="'+base+'" stroke="var(--primary)" stroke-width="2" stroke-dasharray="3 3"/>'
   +'<circle cx="'+cx.toFixed(1)+'" cy="'+(top-4)+'" r="5" fill="var(--primary)"/>'
   +'<rect x="'+chipX.toFixed(1)+'" y="0" width="'+cw+'" height="20" rx="10" fill="var(--soft)"/>'
   +'<text x="'+(chipX+cw/2).toFixed(1)+'" y="14" text-anchor="middle" font-size="11" fill="var(--primary)" '+ff+' font-weight="600">Harga ini</text>'
   +'<text x="0" y="'+(H+16)+'" font-size="10.5" fill="var(--muted)" '+ff+'>'+jt(sorted[0])+'</text>'
   +'<text x="'+(W/2)+'" y="'+(H+16)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)" '+ff+'>median '+jt(med)+'</text>'
   +'<text x="'+W+'" y="'+(H+16)+'" text-anchor="end" font-size="10.5" fill="var(--muted)" '+ff+'>'+jt(sorted[sorted.length-1])+'</text>'
   +'</svg>';
}

       +'<div><button class="btn sm'+(sel?'':' ghost')+'" data-act="usevenue" data-id="'+v.id+'" data-pi="'+i+'">'+(sel?ic("check")+" Dipakai di anggaran":"Pakai di anggaran")+'</button></div></div>';

/* ============ VENDOR ============ */
function vendorsFor(cat){
  var A=area(S.area);
  var list=VENDORS.filter(function(v){return v.cat===cat;}).map(function(v){
    var home=area(v.home), covered=v.cov.indexOf(A.id)>-1||v.cov.indexOf(A.grp)>-1;
    return {v:v,covered:covered,d:home?km(A.lat,A.lng,home.lat,home.lng):0};
  });
  list.sort(function(a,b){ if(a.covered!==b.covered) return a.covered?-1:1; return a.d-b.d; });
  return list;
}
function viewVendor(){
  var A=area(S.area), first=A.name.split(",")[0], cat=S.vcat, c=VCATS.filter(function(x){return x.id===cat;})[0]||VCATS[0];
  var h=topbar()+ptitle("Vendor di "+esc(first),"EO, katering, MUA, hiburan, dan lainnya");

    } else {

function vendorRow(x,i){

/* ============ RENCANA (kalender) ============ */
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var HARI=["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
function p2(n){return n<10?"0"+n:""+n;}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function curYM(){
  if(UI.cal) return UI.cal;
  var d=S.date?new Date(S.date+"T00:00:00"):new Date();
  return d.getFullYear()+"-"+p2(d.getMonth()+1);
}
function calHtml(){
  var parts=curYM().split("-"), y=+parts[0], m=+parts[1];
  var off=(new Date(y,m-1,1).getDay()+6)%7, n=new Date(y,m,0).getDate(), today=ymd(new Date());
  var c='<div class="calh"><h2>'+BLN[m-1]+' <span class="muted">'+y+'</span></h2><div class="btns"><button class="x" data-act="calnav" data-v="-1" aria-label="Bulan sebelumnya">'+ic("chevL")+'</button><button class="x" data-act="calnav" data-v="1" aria-label="Bulan berikutnya">'+ic("chevR")+'</button></div></div>';
  c+='<div class="calg">'+HARI.map(function(d){return '<span class="wd">'+d+'</span>';}).join("");
  for(var i=0;i<off;i++) c+='<span class="e"></span>';
  for(var d=1;d<=n;d++){
    var key=y+"-"+p2(m)+"-"+p2(d);
    c+='<button data-act="pickday" data-d="'+key+'" class="'+(key===S.date?'sel ':'')+(key===today?'today':'')+'" aria-pressed="'+(key===S.date)+'" aria-label="'+d+' '+BLN[m-1]+' '+y+'">'+d+'</button>';
  }
  return c+'</div>';
}
function weekHtml(){
  if(!S.date) return "";
  var base=new Date(S.date+"T00:00:00"), out='';
  for(var k=-2;k<=3;k++){
    var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+k), key=ymd(d);
    out+='<button data-act="pickday" data-d="'+key+'" class="'+(k===0?'sel':'')+'" aria-label="'+d.getDate()+' '+BLN[d.getMonth()]+'">'+d.getDate()+'</button>';
  }
  return '<div class="g week" role="group" aria-label="Pekan sekitar hari-H">'+out+'</div>';
}
function viewSimpan(){
  var r=calc(), days=null, txt="Pilih tanggal rencana di kalender";
  if(S.date){
    var t=new Date(S.date+"T00:00:00"), n=new Date(); n.setHours(0,0,0,0); days=Math.round((t-n)/864e5);
    txt=t.getDate()+" "+BLN[t.getMonth()]+" "+t.getFullYear();

  h+='<div class="bgrid"><div class="col"><div class="g cal">'+calHtml()+'</div>'+weekHtml()+'</div><div class="col">';

  var fv=S.favs.map(function(id){return venue(id)||VENDORS.filter(function(v){return v.id===id;})[0];}).filter(Boolean);
  h+='<h2 style="font-size:19px">Tersimpan</h2>';
  if(!fv.length) h+='<div class="g empty">Belum ada yang disimpan. Ketuk ikon penanda di halaman gedung atau vendor.</div>';
  else h+='<div style="display:flex;flex-direction:column;gap:12px">'+fv.map(function(x,i){
    var isV=!!x.pkgs;
    return '<div class="g vrow">'+(isV?'<span class="av">'+tileAv(i)+'</span>':avInit(x.name,i))
     +'<button class="vb" style="text-align:left" '+(isV?'data-act="venue" data-id="'+x.id+'"':'data-act="tab" data-t="vendor"')+'><b>'+esc(x.name)+'</b><span class="small muted">'+(isV?esc(x.kind)+' · '+esc(area(x.area).name):esc(x.loc))+'</span></button>'
     +'<button class="x" data-act="fav" data-id="'+x.id+'" aria-label="Hapus dari simpanan">'+ic("x")+'</button></div>';
  }).join("")+'</div>';
  return h+'</div></div>';
}

/* ============ SHELL ============ */
var TABS=[["gedung","bld","Gedung"],["vendor","users","Vendor"],["anggaran","pie","Anggaran"],["simpan","cal","Rencana"]];
function navHtml(){
  var rail='<aside class="rail" aria-label="Menu samping">'+TABS.map(function(t){return '<button class="'+(S.tab===t[0]&&!UI.detail?'on':'')+'" data-act="tab" data-t="'+t[0]+'" aria-label="'+t[2]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[1])+'</button>';}).join("")+'</aside>';
  var bar='<nav class="tabbar" aria-label="Menu utama"><div class="in">'+TABS.map(function(t){return '<button class="tab'+(S.tab===t[0]&&!UI.detail?' on':'')+'" data-act="tab" data-t="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[1])+'<span>'+t[2]+'</span></button>';}).join("")+'</div></nav>';
  return {rail:rail,bar:bar};
}
function sheetArea(){
  return '<div class="scrim" data-act="closesheet"><div class="panel" role="dialog" aria-label="Pilih daerah"><div class="ph"><h2>Pilih daerah</h2><button class="x" data-act="closesheet" aria-label="Tutup">'+ic("x")+'</button></div>'
   +'<input id="in-q" class="inp" type="search" placeholder="Ketik kota atau area, misal BSD, Bandung" autocomplete="off" value="'+esc(UI.q)+'" data-in="q"><div id="areaList"></div></div></div>';
}
function paintAreas(){
  var q=UI.q.trim().toLowerCase(), box=$("#areaList"); if(!box) return;
  var l=AREAS.filter(function(a){return !q||a.name.toLowerCase().indexOf(q)>-1;});
  box.innerHTML=l.length?l.map(function(a){return '<button class="opt'+(a.id===S.area?' on':'')+'" data-act="setarea" data-id="'+a.id+'"><b style="font-weight:500">'+esc(a.name)+'</b>'+(a.id===S.area?ic("check"):"")+'</button>';}).join(""):'<div class="empty">Daerah belum tersedia. Pilih kota terdekat dari daftar, misalnya Jakarta Selatan, Bandung, atau Yogyakarta.</div>';
}
function sheetFilter(){
  var f=S.f;
  return '<div class="scrim" data-act="closesheet"><div class="panel" role="dialog" aria-label="Filter gedung"><div class="ph"><h2>Filter gedung</h2><button class="x" data-act="closesheet" aria-label="Tutup">'+ic("x")+'</button></div>'
   +'<div class="grid2"><div class="field"><label for="f-guests">Jumlah tamu minimal</label><input id="f-guests" class="inp num" type="number" inputmode="numeric" step="50" min="0" value="'+(f.guests||"")+'" placeholder="Semua" data-in="fguests"></div>'
   +'<div class="field"><label for="f-max">Biaya maksimal (juta)</label><input id="f-max" class="inp num" type="number" inputmode="numeric" step="10" min="0" value="'+(f.max||"")+'" placeholder="Bebas" data-in="fmax"></div></div>'
   +'<div class="field"><label>Jenis</label><div class="seg">'+[["semua","Semua"],["sewa","Sewa saja"],["paket","Paket"]].map(function(o){return '<button data-act="ftype" data-v="'+o[0]+'" class="'+(f.type===o[0]?'on':'')+'">'+o[1]+'</button>';}).join("")+'</div></div>'
   +'<div class="field"><label>Urutkan</label><div class="seg">'+[["dekat","Terdekat"],["murah","Termurah"]].map(function(o){return '<button data-act="fsort" data-v="'+o[0]+'" class="'+(f.sort===o[0]?'on':'')+'">'+o[1]+'</button>';}).join("")+'</div></div>'
   +'<div class="btns"><button class="btn navy" data-act="closesheet">Tampilkan hasil</button><button class="btn ghost" data-act="resetf">Reset</button></div></div></div>';
}
function render(keepScroll){
  var body;
  if(UI.detail) body=viewDetail();
  else if(S.tab==="gedung") body=viewGedung();
  else if(S.tab==="vendor") body=viewVendor();
  else if(S.tab==="anggaran") body=viewBudget();
  else body=viewSimpan();
  var nv=navHtml();
  $("#app").innerHTML='<div class="shell">'+nv.rail+'<main class="main">'+body+'</main></div>'+nv.bar+(UI.sheet==="area"?sheetArea():UI.sheet==="filter"?sheetFilter():"");
  if(S.tab==="anggaran"&&!UI.detail) paintBudget();
  if(UI.sheet==="area"){ paintAreas(); var q=$("#in-q"); if(q) q.focus(); }
  if(!keepScroll) window.scrollTo(0,0);
}

/* ============ EVENTS ============ */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  if(a==="closesheet"){ if(el.classList.contains("scrim")&&e.target!==el) return; UI.sheet=null; render(true); return; }
  if(a==="tab"){ S.tab=el.getAttribute("data-t"); UI.detail=null; UI.sheet=null; save(); render(); return; }
  if(a==="area"){ UI.sheet="area"; UI.q=""; render(true); return; }
  if(a==="filter"){ UI.sheet="filter"; render(true); return; }
  if(a==="setarea"){ S.area=id; UI.sheet=null; save(); render(true); return; }
  if(a==="venue"){ UI.scroll=window.scrollY; UI.detail=id; render(); return; }
  if(a==="back"){ UI.detail=null; render(true); window.scrollTo(0,UI.scroll); return; }
  if(a==="fav"){ var i=S.favs.indexOf(id); if(i>-1) S.favs.splice(i,1); else S.favs.push(id); save(); render(true); return; }
  if(a==="usevenue"){ var v=venue(id), pi=Number(el.getAttribute("data-pi")); S.b.venue={id:id,pi:pi}; S.b.cateringIncl=(v.cat==="ya"); save(); render(true); return; }
  if(a==="clearvenue"){ S.b.venue=null; S.b.cateringIncl=false; save(); paintBudget(); return; }
  if(a==="tier"){ S.b.tier=el.getAttribute("data-t"); save(); render(true); return; }
  if(a==="toggle"){ S.b.on[id]=(S.b.on[id]===false); save(); paintBudget(); return; }
  if(a==="edit"){ UI.editing=(UI.editing===id?null:id); paintBudget(); var o=$("#in-ov"); if(o) o.focus(); return; }
  if(a==="ovreset"){ delete S.b.over[id]; UI.editing=null; save(); paintBudget(); return; }
  if(a==="vcat"){ S.vcat=id; save(); render(true); return; }
  if(a==="ftype"){ S.f.type=el.getAttribute("data-v"); save(); render(true); return; }
  if(a==="fsort"){ S.f.sort=el.getAttribute("data-v"); save(); render(true); return; }
  if(a==="resetf"){ S.f={guests:0,max:0,type:"semua",sort:"dekat"}; save(); render(true); return; }
  if(a==="pdf"){ downloadPdf(); return; }
  if(a==="calnav"){ var pp=curYM().split("-"), dd=new Date(+pp[0],+pp[1]-1+Number(el.getAttribute("data-v")),1); UI.cal=dd.getFullYear()+"-"+p2(dd.getMonth()+1); render(true); return; }
  if(a==="pickday"){ var key=el.getAttribute("data-d"); S.date=(S.date===key&&el.closest(".calg")?"":key); UI.cal=null; save(); render(true); return; }
});
document.addEventListener("input",function(e){
  var el=e.target, k=el.getAttribute&&el.getAttribute("data-in"); if(!k) return;
  var v=el.value, n=parseFloat(v);
  if(k==="q"){ UI.q=v; paintAreas(); return; }
  if(k==="fguests"){ S.f.guests=isNaN(n)?0:n; save(); return; }
  if(k==="fmax"){ S.f.max=isNaN(n)?0:n; save(); return; }
  if(k==="cat"){ S.b.cateringIncl=el.checked; save(); paintBudget(); return; }
  if(k==="alat"){ S.b.alat=el.checked; save(); paintBudget(); return; }
  if(k==="nikah"){ S.b.nikah=v; save(); paintBudget(); return; }
  if(k==="ringK"){ S.b.ringK=n; save(); paintBudget(); return; }
  if(k==="target"){ S.b.target=isNaN(n)||n<0?0:n*1e6; save(); paintBudget(true); return; }
  if(k==="ov"){ var id=el.getAttribute("data-id"); if(isNaN(n)) delete S.b.over[id]; else S.b.over[id]=n*1e6; save(); paintBudget(true); return; }
  if(k==="gold") S.b.goldEdited=true;
  if(["pax","qty","gold","ringG","mahrG","ringExtra"].indexOf(k)>-1){ S.b[k]=isNaN(n)||n<0?0:n; save(); paintBudget(); return; }
});
document.addEventListener("change",function(e){
  var k=e.target.getAttribute&&e.target.getAttribute("data-in");
  if(k==="fguests"||k==="fmax") render(true);
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&UI.sheet){UI.sheet=null; render(true);} });
var DATA_META=null;
function downloadPdf(){
  var J=window.jspdf;
  if(!J||!J.jsPDF){ window.print(); return; }
  var r=calc(), b=S.b, A=area(S.area), now=new Date();
  var doc=new J.jsPDF({unit:"pt",format:"a4"}), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), mx=40;
  var tgl=now.getDate()+" "+BLN[now.getMonth()]+" "+now.getFullYear();
  var purple=[107,109,217], ink=[36,35,63], muted=[118,116,154];
  doc.setFillColor(purple[0],purple[1],purple[2]); doc.rect(0,0,W,104,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(21); doc.text("Rencana Anggaran Pernikahan",mx,52);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Dibuat "+tgl+"  |  "+A.name,mx,74);
  var y=140;
  doc.setTextColor(muted[0],muted[1],muted[2]); doc.setFontSize(10); doc.text("Perkiraan total untuk "+b.pax.toLocaleString("id-ID")+" tamu",mx,y);
  doc.setTextColor(ink[0],ink[1],ink[2]); doc.setFont("helvetica","bold"); doc.setFontSize(30); doc.text(jt(r.mid),mx,y+34);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text("Kisaran "+jt(r.low)+" - "+jt(r.high)+"  |  sekitar "+jt(r.mid/Math.max(b.pax,1))+" per tamu",mx,y+54);
  var t=b.target, pct=t>0?r.mid/t*100:0;
  var info=[["Gaya acara",b.tier.charAt(0).toUpperCase()+b.tier.slice(1)],["Jumlah seragam",b.qty+" set"],
    ["Gedung",r.vc?r.vc.v.name+" ("+r.vc.p.n+")":"Belum dipilih (kisaran umum)"],
    ["Target anggaran",t>0?jt(t)+" ("+pct.toFixed(1).replace(".",",")+"% terpakai)":"Belum diisi"],
    ["Tanggal rencana",S.date?(function(d){return d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear();})(new Date(S.date+"T00:00:00")):"Belum dipilih"],
    ["Harga emas 24K",rpFull(b.gold)+" / gram"]];
  doc.autoTable({startY:y+72,body:info,theme:"plain",styles:{fontSize:9.5,cellPadding:{top:3,bottom:3,left:0,right:8},textColor:ink},columnStyles:{0:{textColor:muted,cellWidth:110}},margin:{left:mx,right:mx}});
  var rows=r.rows.filter(function(x){return x.on;}).map(function(x){
    var basis=x.it.basis==="sumber"?"Ada sumber":(x.it.basis==="emas"?"Harga emas":"Estimasi");
    return [x.it.label,x.note,amtText(x),x.ov?"Angka sendiri":basis];
  });
  if(r.cad.on) rows.push(["Dana cadangan 10%","Biaya tak terduga",jt((r.cad.lo+r.cad.hi)/2),"Estimasi"]);
  doc.autoTable({startY:doc.lastAutoTable.finalY+18,head:[["Item","Keterangan","Biaya","Dasar"]],body:rows,
    foot:[["Total","Kisaran "+jt(r.low)+" - "+jt(r.high),jt(r.mid),""]],
    theme:"striped",headStyles:{fillColor:purple,textColor:255,fontSize:9},footStyles:{fillColor:[228,225,248],textColor:ink,fontSize:9.5},
    styles:{fontSize:8.5,cellPadding:5,textColor:ink,overflow:"linebreak"},alternateRowStyles:{fillColor:[247,245,253]},
    columnStyles:{0:{cellWidth:130},1:{cellWidth:"auto"},2:{cellWidth:92,halign:"right"},3:{cellWidth:70}},margin:{left:mx,right:mx,bottom:50}});
  var tot=r.sub.reduce(function(a,c){return a+c;},0)||1;
  var gy=doc.lastAutoTable.finalY+18;
  if(gy>H-190){ doc.addPage(); gy=50; }
  doc.autoTable({startY:gy,head:[["Kelompok","Porsi"]],body:r.sub.map(function(sv,i){return [GROUPS[i].n,Math.round(sv/tot*100)+"%"];}),
    theme:"striped",headStyles:{fillColor:purple,textColor:255,fontSize:9},styles:{fontSize:8.5,cellPadding:5,textColor:ink},
    columnStyles:{1:{halign:"right",cellWidth:60}},margin:{left:mx,right:mx,bottom:50},tableWidth:260});
  var y2=doc.lastAutoTable.finalY+22;
  var notes=["Catatan","Angka berlabel Ada sumber diturunkan dari harga di artikel publik (2019-2026) lalu disesuaikan kenaikan 4,5% per tahun. Angka berlabel Estimasi adalah kisaran pasar dari asumsi umum dan belum diverifikasi ke vendor. Faktor harga kota ("+String(A.lvl).replace(".",",")+"x untuk "+A.name.split(",")[0]+") juga estimasi. Ini perkiraan, bukan penawaran: minta penawaran tertulis dari vendor.",
    DATA_META&&DATA_META.updatedAt?"Data terakhir diperbarui "+(function(d){return d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear();})(new Date(DATA_META.updatedAt))+(DATA_META.gold&&DATA_META.gold.asOf?"; harga emas per "+DATA_META.gold.asOf+".":"."):""];
  var lines=doc.splitTextToSize(notes[1]+" "+notes[2],W-2*mx);
  if(y2+16+lines.length*11>H-60){ doc.addPage(); y2=60; }
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(ink[0],ink[1],ink[2]); doc.text(notes[0],mx,y2);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(muted[0],muted[1],muted[2]); doc.text(lines,mx,y2+15);
  var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]); doc.text("Rencana Nikah  |  halaman "+i+" dari "+n,mx,H-28); }
  doc.save("rencana-nikah-"+now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+".pdf");
}
function dataNote(){
  if(!DATA_META||!DATA_META.updatedAt) return "";
  var t=new Date(DATA_META.updatedAt), txt=" Data diperbarui "+t.getDate()+" "+BLN[t.getMonth()]+" "+t.getFullYear()+".";
  if(DATA_META.gold&&DATA_META.gold.stale) txt+=" Harga emas belum berhasil diperbarui bulan ini.";
  return txt;
}
function applyData(d){
  if(d.venues&&d.venues.length) VENUES=d.venues;
  if(d.vendors&&d.vendors.length) VENDORS=d.vendors;
  if(d.gold&&d.gold.price){ GOLD_AS_OF=d.gold.asOf||GOLD_AS_OF; if(!S.b.goldEdited) S.b.gold=d.gold.price; }
  DATA_META=d;
}
render();
try{
  fetch("data/data.json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d) return; applyData(d);
    if(!UI.sheet&&!UI.editing&&document.activeElement===document.body) render(true);
  }).catch(function(){});
}catch(e){}
</script>
